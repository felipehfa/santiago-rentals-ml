# Entrenamiento diario: repite la búsqueda completa de Optuna (unos 22 min en el runner), registra el challenger y corre
# el gate. Con modo=reentrenar usa en cambio los hiperparámetros del último Optuna (más rápido, solo a mano). Si el gate
# promueve un modelo nuevo, el scoring vuelve a predecir todos los avisos con esa versión. Al final mide la degradación
# del champion.
name: entrenar
on:
  schedule:
    - cron: "30 7 * * *"        # 07:30 UTC: madrugada en Chile, después de que Gold se haya actualizado de noche
  workflow_dispatch:
    inputs:
      modo:
        description: "tune = Optuna completo (el primero siempre debe serlo); reentrenar = parámetros del último Optuna"
        type: choice
        options: [tune, reentrenar]
        default: tune

# El token de GitHub solo lee el repo. Los secretos van en cada paso que los usa, no en todo el job: así `pip install`
# (código de terceros) no los ve.
permissions:
  contents: read

concurrency:
  group: entrenar
  cancel-in-progress: false

jobs:
  entrenar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      promovido: ${{ steps.gate.outputs.promovido }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Entrenar
        env:
          MODO: ${{ inputs.modo }}
          BD_STRING_READ: ${{ secrets.BD_STRING_READ }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_ARTIFACT_ROOT: ${{ vars.MLFLOW_ARTIFACT_ROOT }}
          MLFLOW_S3_ENDPOINT_URL: ${{ vars.MLFLOW_S3_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
        run: |
          modo="$MODO"
          # Sin entrada manual (cron): siempre Optuna completo.
          if [ -z "$modo" ]; then modo=tune; fi
          echo "Modo: $modo"
          if [ "$modo" = "tune" ]; then python -m src.tune --refrescar; else python -m src.reentrenar --refrescar; fi

      - name: Registrar el challenger
        env:
          BD_STRING_READ: ${{ secrets.BD_STRING_READ }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_ARTIFACT_ROOT: ${{ vars.MLFLOW_ARTIFACT_ROOT }}
          MLFLOW_S3_ENDPOINT_URL: ${{ vars.MLFLOW_S3_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
        run: python -m src.register

      - name: Gate de promoción
        id: gate
        env:
          BD_STRING_READ: ${{ secrets.BD_STRING_READ }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_ARTIFACT_ROOT: ${{ vars.MLFLOW_ARTIFACT_ROOT }}
          MLFLOW_S3_ENDPOINT_URL: ${{ vars.MLFLOW_S3_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
        run: |
          set +e
          python -m src.promote
          codigo=$?
          echo "Código del gate: $codigo (0 promueve, 2 rechaza)"
          if [ "$codigo" = "0" ]; then echo "promovido=true" >> "$GITHUB_OUTPUT"; else echo "promovido=false" >> "$GITHUB_OUTPUT"; fi
          # 2 = el gate rechaza al challenger: es un resultado normal, no un error del workflow.
          [ "$codigo" = "0" ] || [ "$codigo" = "2" ]

      - name: Monitoreo del champion
        env:
          BD_STRING_READ: ${{ secrets.BD_STRING_READ }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_ARTIFACT_ROOT: ${{ vars.MLFLOW_ARTIFACT_ROOT }}
          MLFLOW_S3_ENDPOINT_URL: ${{ vars.MLFLOW_S3_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
        run: |
          set +e
          python -m src.monitoreo
          codigo=$?
          echo "Código del monitoreo: $codigo (0 normal, 1 sin datos suficientes, 3 champion degradado)"
          [ "$codigo" -le 3 ]

  scoring:
    needs: entrenar
    if: ${{ needs.entrenar.result == 'success' }}
    uses: ./.github/workflows/scoring.yml
    secrets: inherit
