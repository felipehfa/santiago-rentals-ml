# Configuración única del repo de modelo. Todo lo que cambia entre corridas vive acá,
# para que el PC y GitHub Actions ejecuten exactamente lo mismo.

semilla: 42

mlflow:
  experimento: santiago-rentals-costo-total
  modelo_registrado: santiago-rentals-costo-total
  # Sin MLFLOW_TRACKING_URI se usa SQLite local; al automatizar apunta a Postgres de Supabase.
  tracking_uri_local: sqlite:///mlflow.db

datos:
  tabla: gold.aviso_entrenamiento
  snapshot: data/gold_aviso_entrenamiento.parquet
  # Cota provisional: hay un aviso con gastos comunes de 95 millones (error de captura que Silver no marca).
  costo_total_max_clp: 10000000
  # Gastos comunes sobre el arriendo: sobre este porcentaje el aviso se descarta (error de captura).
  # Los gastos típicos son ~20 % del arriendo (mediana 19,7 %, tercer cuartil 24 %), así que 0,25
  # descartaría ~20 % de los avisos válidos; 0,5 deja fuera solo ~21 casos claramente absurdos.
  gastos_comunes_max_pct_arriendo: 0.5
  # Ventana de entrenamiento: solo entrenan los avisos publicados hasta N días antes de la última visita
  # registrada; val y test quedan completos, para comparar contra el champion en las mismas filas.
  # Los precios de oferta viejos suelen estar desactualizados (en pruebas, 60 días bajó el MAE ~5 %).
  # null = sin ventana.
  ventana_dias: 60
  # Comunas fuera del modelo (no interesan: orientales de alto precio y periféricas del sur). Sus avisos siguen en Gold;
  # solo se descartan al preparar los datos. Lista vacía o null = todas.
  comunas_excluidas:
    - las-condes-metropolitana
    - vitacura-metropolitana
    - lo-barnechea-metropolitana
    - la-reina-metropolitana
    - penalolen-metropolitana
    - quilicura-metropolitana
    - maipu-metropolitana
    - puente-alto-metropolitana
    - san-bernardo-metropolitana
    - cerrillos-metropolitana
    - pedro-aguirre-cerda-metropolitana

target: costo_total_clp

split:
  test: 0.15
  val: 0.15
  n_estratos: 5          # quintiles de costo total, como en Concepción

variables:
  radio_sector_m: 300    # radio del comparador de precio por m2
  multiplicador_iqr: 3   # descarta precios por m2 anómalos del comparador
  k_suavizado: 20        # avisos "virtuales" del promedio general al suavizar barrios y comunas
  n_niveles_barrio: 5
  seleccion: features_seleccionadas.json   # si no existe, se usan todas
  # Puntos de referencia [latitud, longitud] para las distancias en km. Son aproximados (unos 300 m de
  # margen) y se pueden afinar. La distancia al centro de la comuna sale de los avisos de train.
  # Modelo de texto: TF-IDF + ridge sobre el título y la descripción (sin números) que estima log(costo por m2).
  # Su salida es una variable más; para las filas de train es una predicción fuera de muestra (CV de `folds` grupos).
  texto:
    activo: true
    ngram_max: 2
    min_df: 8
    max_features: 30000
    alpha: 3.0
    folds: 5
  puntos_referencia:
    plaza_armas: [-33.4378, -70.6505]       # centro de Santiago
    el_golf: [-33.4165, -70.5946]           # eje de oficinas y vivienda de alto precio
    centro_las_condes: [-33.4097, -70.5776] # municipalidad de Las Condes
    centro_providencia: [-33.4260, -70.6170] # municipalidad de Providencia

optuna:
  n_trials: 50
  cv_splits: 5
  early_stopping: 50
  max_rondas: 500

bagging:
  n_modelos: 10
  max_rondas: 1000
  early_stopping: 50

seleccion_variables:
  n_modelos: 30
  cv_folds: 5
  umbral_presencia: 0.6
  umbral_correlacion: 0.95
  k_min: 3
  n_semillas_curva: 5

etiquetas:
  n_deciles: 10
  umbral_oportunidad: 1.0
  umbral_caro: 1.0

# Quality gate. Champion y challenger se comparan sobre las mismas filas (el test del challenger sin
# los avisos con que se entrenó el champion), porque los datos crecen con el tiempo.
# Provisional: se recalibra con más datos. null = el criterio no se aplica.
gate:
  mape_max: null                  # error porcentual medio máximo aceptable en el test propio (%)
  estabilidad_cv_max: null        # coeficiente de variación del MAE entre particiones
  mejora_min: 0.01                # el challenger promueve si baja el MAE del champion más que esto (1 %)
  exigir_ic: true                 # y además el IC95 de la mejora (bootstrap) debe quedar sobre 0: no basta con ruido
  degradacion_umbral: 0.05        # el champion está degradado si su MAE sube más de 5 % vs su test original
  margen_vs_champion: 0.0         # si el champion está degradado, el challenger no puede ser peor que él
  n_minimo_comparacion: 100       # avisos comunes necesarios para poder comparar

# Scoring por lotes a gold.predicciones. Además de los aptos, se predicen los excluidos solo por estos motivos
# (el modelo igual estima su precio esperado, útil para detectar precios atípicos).
scoring:
  motivos_predecibles: [precio_m2_atipico, finalizado_antiguo]   # precio_sospechoso no: un precio absurdo no se etiqueta

# Monitoreo del champion sobre avisos llegados después de su entrenamiento.
monitoreo:
  n_minimo: 50                    # con menos avisos nuevos no se concluye nada
